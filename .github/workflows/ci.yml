name: CI

# Builds the program and runs every test: the unit tests, natively and as
# WASI under the harness's rootshell, and the program against a stand-in
# iPhone. Its `test` job is the check the main branch's ruleset requires,
# and release.yml runs it on a tag before it publishes anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A pull request's newer push replaces its older run; main's and a
  # release's runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, as rust-toolchain.toml pins it, with the WASI target
        run: rustup toolchain install
      - name: Python, for the harness
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: The harness's Python packages
        run: pip install --require-hashes -r harness/requirements.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --target wasm32-wasip1 -- -D warnings
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Unit tests as WASI, under rootshell's runtime as the harness has it
        run: |
          mkdir -p "$RUNNER_TEMP/wasi"
          CARGO_TARGET_WASM32_WASIP1_RUNNER="python3 $GITHUB_WORKSPACE/harness/rootshell.py --dir $RUNNER_TEMP/wasi" \
            cargo test --locked --target wasm32-wasip1
      - name: The program
        run: cargo build --locked --release --target wasm32-wasip1
      - name: The program, with a stand-in iPhone
        run: |
          cargo build --locked -p atelier-testphone
          python3 harness/test_install.py
      - name: Keep the program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atelier-install.wasm
          path: target/wasm32-wasip1/release/atelier-install.wasm
          if-no-files-found: error
