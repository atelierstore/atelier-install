name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, with the WASI target
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-wasip1
          rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The harness's Python packages
        run: pip install wasmtime==50.0.1 dnslib==0.9.26
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --all-targets --target wasm32-wasip1 -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Unit tests as WASI, under rootshell's runtime as the harness has it
        run: |
          mkdir -p "$RUNNER_TEMP/wasi"
          CARGO_TARGET_WASM32_WASIP1_RUNNER="python3 $GITHUB_WORKSPACE/harness/rootshell.py --dir $RUNNER_TEMP/wasi" \
            cargo test --target wasm32-wasip1
      - name: The program
        run: cargo build --release --target wasm32-wasip1
      - name: The program, with a stand-in iPhone
        run: |
          cargo build -p atelier-testphone
          python3 harness/test_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-install.wasm
          path: target/wasm32-wasip1/release/atelier-install.wasm
