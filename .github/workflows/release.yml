name: Release

# A tag such as v0.1.0 publishes that version of the program as the
# release's atelier-install.wasm, which the README's link
# (releases/latest/download) serves:
#
# 1. the tag has to be the version in Cargo.toml, and the repo public,
# 2. CI runs every test on the tag (ci.yml) and builds the program with the
#    Rust that rust-toolchain.toml pins,
# 3. that same file, the one the tests ran, gets signed build provenance,
#    which says this workflow built it from the tag's commit, and
# 4. it's published with its SHA-256.
#
# Only the repo's admins can push a v* tag (the "Release tags" ruleset). A
# tag with a suffix, such as v0.2.0-beta.1, makes a pre-release, which
# releases/latest/download skips.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is Cargo.toml's version, and the repo is public
        id: check
        env:
          TAG: ${{ github.ref_name }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" = true ]; then
            echo "::error::Make the repo public first: build provenance needs it, and the README's download link only works for everyone once it is. Then re-run this workflow."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag $TAG isn't vMAJOR.MINOR.PATCH, optionally with a suffix such as -beta.1."
            exit 1
          fi
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG isn't the version in Cargo.toml, $version. Change [workspace.package] version in a pull request first, then tag its merge."
            exit 1
          fi
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "atelier-install $version"

  test:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write: it creates the release and signs the
    # provenance, and runs nothing but GitHub's attest action and gh.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Get the program CI tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atelier-install.wasm
          path: .
      - name: Its SHA-256
        run: sha256sum atelier-install.wasm | tee atelier-install.wasm.sha256
      - name: Build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: atelier-install.wasm
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          digest=$(cut -d' ' -f1 atelier-install.wasm.sha256)
          cat > notes.md <<NOTES
          \`atelier-install.wasm\`, built from $COMMIT by [this run]($RUN), which ran every test on it first.

          SHA-256: \`$digest\`

          In rootshell:

          \`\`\`sh
          curl -fsSLO https://github.com/$REPO/releases/download/$TAG/atelier-install.wasm
          \`\`\`

          To check that this repo's release workflow built it, with GitHub's CLI:

          \`\`\`sh
          gh attestation verify atelier-install.wasm --repo $REPO
          \`\`\`
          NOTES
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" atelier-install.wasm atelier-install.wasm.sha256 \
            --repo "$REPO" --verify-tag --title "atelier-install ${TAG#v}" \
            --notes-file notes.md --generate-notes "${flags[@]}"
