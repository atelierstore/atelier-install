name: Release

# Publishes the program as a release's atelier-install.wasm, which the
# README's link (releases/latest/download) serves. A release is made when
#
# - a pull request that changes [workspace.package] version in Cargo.toml
#   merges into main, and that version has no tag yet: the workflow tags the
#   merge commit, such as v0.2.0, or
# - an admin pushes that tag on a commit in main ("Release tags" ruleset).
#
# Either way:
#
# 1. the tag has to be Cargo.toml's version, on a commit in main, and the
#    repo public,
# 2. CI runs every test on that commit (ci.yml) and builds the program with
#    the Rust that rust-toolchain.toml pins,
# 3. that same file, the one the tests ran, gets signed build provenance,
#    which says this workflow built it, from that commit, and
# 4. it's published with its SHA-256.
#
# A version with a suffix, such as 0.2.0-beta.1, makes a pre-release, which
# releases/latest/download skips. The workflow's own token makes the tag of
# a merged version, so the "Release tags" ruleset has to let GitHub Actions
# create v* tags.

on:
  push:
    branches: [main]
    # GitHub doesn't apply paths to a tag push, so a tag always runs this.
    paths: [Cargo.toml]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out, with main's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A new version, or a tag that is Cargo.toml's version on main
        id: check
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$REF" = refs/heads/main ]; then
            tag="v$version"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "$tag is already tagged, so this change to Cargo.toml makes no release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            tag="$REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::Tag $tag isn't the version in Cargo.toml, $version. Change [workspace.package] version in a pull request instead: merging it makes the release."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Tag $tag isn't on a commit in main. Tag the merge commit of the pull request that changed the version."
              exit 1
            fi
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version ${tag#v} isn't MAJOR.MINOR.PATCH, optionally with a suffix such as -beta.1."
            exit 1
          fi
          if [ "$PRIVATE" = true ]; then
            echo "::error::Make the repo public first: build provenance needs it, and the README's download link only works for everyone once it is. Then re-run this workflow."
            exit 1
          fi
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "atelier-install $version, as $tag"

  test:
    name: CI
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write: it creates the release and signs the
    # provenance, and runs nothing but GitHub's attest action and gh.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Get the program CI tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atelier-install.wasm
          path: .
      - name: Its SHA-256
        run: sha256sum atelier-install.wasm | tee atelier-install.wasm.sha256
      - name: Build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: atelier-install.wasm
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          digest=$(cut -d' ' -f1 atelier-install.wasm.sha256)
          cat > notes.md <<NOTES
          \`atelier-install.wasm\`, built from $COMMIT by [this run]($RUN), which ran every test on it first.

          SHA-256: \`$digest\`

          In rootshell:

          \`\`\`sh
          curl -fsSLO https://github.com/$REPO/releases/download/$TAG/atelier-install.wasm
          \`\`\`

          To check that this repo's release workflow built it, with GitHub's CLI:

          \`\`\`sh
          gh attestation verify atelier-install.wasm --repo $REPO
          \`\`\`
          NOTES
          # A merged version gets its tag here, on the commit CI tested; a
          # pushed tag has to be there already.
          if [ "$REF" = refs/heads/main ]; then
            flags=(--target "$COMMIT")
          else
            flags=(--verify-tag)
          fi
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" atelier-install.wasm atelier-install.wasm.sha256 \
            --repo "$REPO" --title "atelier-install ${TAG#v}" \
            --notes-file notes.md --generate-notes "${flags[@]}"
